<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light">
<title>Brain Playground</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--canvas:#E6DEFB;--surface:#F6F6F7;--ink:#14151F;--ink2:#5E6070;--lilac:#B7A3FF;--peach:#FDB95A;--sky:#A9C9FF;--mint:#A8E6BC;--lemon:#FFE86B;--coral:#F3B5B5;--font:"Plus Jakarta Sans",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--canvas);font-family:var(--font);color:var(--ink)}
#app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--surface);padding:22px 18px 120px;position:relative}
@media(min-width:500px){#app{margin:24px auto;min-height:calc(100vh - 48px);border-radius:36px;box-shadow:0 30px 50px -20px rgba(60,40,120,.35)}}
h1,h2,h3,p{margin:0}
.disp{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.ttl{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:22px 0 12px}
.sm{font-size:13px;color:var(--ink2);line-height:1.45}
.adm-tabs{display:flex;gap:8px;overflow:auto;margin:18px 0 8px;padding-bottom:4px}.adm-tabs button{border:1px solid #E3E3E8;background:#fff;border-radius:999px;padding:10px 15px;font:700 13px var(--font);white-space:nowrap}.adm-tabs button.on{background:var(--ink);color:#fff}.adm-stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.adm-stat .card{padding:16px;border-radius:20px}.adm-list{display:grid;gap:10px;margin-top:12px}.adm-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #E3E3E8;border-radius:20px;padding:14px}.adm-row>div:first-child{flex:1;min-width:0}.adm-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.adm-actions .btn{min-height:42px;padding:9px 14px;font-size:13px}.adm-field{margin-top:12px}.adm-field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.adm-field input,.adm-field textarea,.adm-field select{margin:0;text-align:left;font-size:15px;font-weight:500;width:100%;padding:12px 14px;border:1px solid #E3E3E8;border-radius:16px;background:#fff;color:var(--ink);font-family:var(--font)}.adm-field textarea{min-height:100px;resize:vertical}.adm-check{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;margin-top:12px}.adm-check input{width:20px;height:20px;margin:0}.adm-preview{border:1px dashed #C9CAD3;border-radius:22px;padding:16px;margin-top:12px;background:var(--surface)}.adm-logo{width:52px;height:52px;border-radius:16px;background:var(--mint);object-fit:contain;display:grid;place-items:center;overflow:hidden;flex:none}.adm-logo img{width:100%;height:100%;object-fit:contain}.adm-muted{color:var(--ink2);font-size:12px}.adm-sticky{position:sticky;bottom:14px;z-index:4;background:rgba(246,246,247,.94);padding-top:10px}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd b{display:block;font-size:17px}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid #E3E3E8;background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.card{border-radius:28px;padding:20px;position:relative;overflow:hidden}
.lilac{background:var(--lilac)}.peach{background:var(--peach)}.sky{background:var(--sky)}.mint{background:var(--mint)}.lemon{background:var(--lemon)}.coral{background:var(--coral)}.white{background:#fff}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gc{border:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s}
.gc:active,.btn:active{transform:scale(.97)}
.gc b{font-size:19px;letter-spacing:-.02em;line-height:1.1}
.chip{display:inline-block;color:var(--ink);white-space:nowrap;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.65);font-size:12px;font-weight:700}
.chip.dk{background:var(--ink);color:#fff}
.btn{border:0;border-radius:999px;padding:16px 26px;font:700 16px var(--font);background:var(--ink);color:#fff;cursor:pointer;min-height:56px}
.btn.lt{background:#fff;color:var(--ink);border:1px solid #E3E3E8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stats .card{padding:14px;border-radius:20px}
.stats small{display:block;font-size:12px;font-weight:500}.stats b{font-size:26px;letter-spacing:-.02em}
.dots{display:flex;gap:6px;flex:1;margin:0 12px}.dots i{flex:1;height:8px;border-radius:9px;background:#E3E3E8}.dots i.d{background:var(--ink)}
.q{font-size:30px;font-weight:800;text-align:center;margin:22px 0;letter-spacing:-.02em}
.seq{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.seq span{min-width:52px;padding:14px 10px;border-radius:20px;background:#fff;font-size:24px;font-weight:800;text-align:center}
.seq span.u{background:var(--lilac)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.o{min-height:72px;border:0;border-radius:24px;background:var(--sky);font:800 26px var(--font);color:var(--ink);cursor:pointer}
.o.ok{background:var(--mint)}.o.no{background:var(--coral)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.pad{aspect-ratio:1;border:0;border-radius:28px;cursor:pointer;transition:transform .1s}
.pad.on{transform:scale(.92);box-shadow:inset 0 0 0 6px var(--ink)}
.grid{display:grid;gap:8px;margin-top:18px}
.grid button{aspect-ratio:1;border:0;border-radius:18px;cursor:pointer}
#msg{text-align:center;font-weight:700;min-height:24px;margin-top:16px}
.big{font-size:72px;font-weight:800;letter-spacing:-.04em;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
button{font-family:var(--font);color:var(--ink)}
.bad{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:20px;background:#fff;margin-bottom:10px}
.bad.lock{opacity:.4}.bad i{width:36px;height:36px;border-radius:50%;background:var(--lemon);flex:none}
.bar{height:14px;border-radius:9px;background:#E3E3E8;margin:6px 0 14px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--lilac)}
input{color:var(--ink);background:#fff;font:700 22px var(--font);padding:14px;border-radius:20px;border:1px solid #E3E3E8;width:100%;text-align:center;margin:14px 0}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));width:min(300px,calc(100% - 36px));background:var(--ink);border-radius:999px;padding:8px;display:flex;justify-content:space-around;z-index:5}
nav button{width:50px;height:50px;border-radius:50%;border:0;background:none;color:#B9BBC9;display:grid;place-items:center;cursor:pointer}
nav button[aria-current=page]{background:#fff;color:var(--ink)}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app"><div id="v"></div></div>
<nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=s=>document.querySelector(s),K='brainplay1';
const BP_SUPABASE={url:'YOUR_SUPABASE_URL',anon:'YOUR_SUPABASE_ANON_KEY'};
let cloud=null,remote={announcement:'',games:{},ads:{enabled:true,list:[]}},adminUser=null,cloudTimer=null,adConfig={enabled:false,unitId:'',testMode:true};
function cloudReady(){return BP_SUPABASE.url.startsWith('https://')&&!!BP_SUPABASE.anon}
function restHeaders(token){return {'apikey':BP_SUPABASE.anon,'Authorization':'Bearer '+(token||BP_SUPABASE.anon),'Content-Type':'application/json'}}
async function restGetConfig(){const r=await fetch(BP_SUPABASE.url+'/rest/v1/app_config?id=eq.main&select=data',{headers:restHeaders()});if(!r.ok)throw new Error('Cloud read failed ('+r.status+')');const a=await r.json();return a[0]?.data||null}
async function cloudInit(){if(!cloudReady())return;try{if(window.supabase){cloud=supabase.createClient(BP_SUPABASE.url,BP_SUPABASE.anon);cloud.auth.onAuthStateChange((_e,s)=>{adminUser=s?.user||null;if(view==='admin')render()});try{cloud.channel('app_config_changes').on('postgres_changes',{event:'*',schema:'public',table:'app_config',filter:'id=eq.main'},p=>{if(p.new?.data){remote=Object.assign({announcement:'',games:{},ads:{enabled:true,list:[]}},p.new.data||{});adConfig=Object.assign(adConfig,remote.ads?.admob||{});try{localStorage.setItem('brainplay_cloud',JSON.stringify(remote))}catch(e){};if(view==='home'||view==='res'||view==='par')render()}}).subscribe()}catch(e){}}await loadRemote();cloudTimer=setInterval(loadRemote,10000)}catch(e){console.warn(e)}}
async function loadRemote(){if(!cloudReady())return;try{let data=null;if(cloud){const q=await cloud.from('app_config').select('data').eq('id','main').maybeSingle();if(!q.error)data=q.data?.data}else data=await restGetConfig();if(data){remote=Object.assign({announcement:'',games:{},ads:{enabled:true,list:[]}},data);adConfig=Object.assign(adConfig,remote.ads?.admob||{});try{localStorage.setItem('brainplay_cloud',JSON.stringify(remote))}catch(e){}}if(view==='home')render()}catch(e){console.warn(e)}}
function gameName(id){return remote.games?.[id]?.name||G[id]?.n}
function gameDesc(id){return remote.games?.[id]?.desc||G[id]?.d}
function syncAd(){try{if(window.AndroidAd&&AndroidAd.setBannerVisible)AndroidAd.setBannerVisible(!!adConfig.enabled&&['home','game','res','rew'].includes(view))}catch(e){}}
const D=new Date().toLocaleDateString('en-CA'),Y=new Date(Date.now()-864e5).toLocaleDateString('en-CA');
let S={name:'',pin:'',ra:'',lang:'en',days:[],best:0,claimed:[],stars:0,streak:0,last:'',sound:true,daily:'',lv:{p:1,e:1,m:1,o:1},sk:{r:[0,0],m:[0,0],a:[0,0],f:[0,0]},played:{},badges:[]},tok=0,view='home',g={},gate=false,flt='all',pg={pt:0,lk:0,fg:0,ch:0};
try{const x=JSON.parse(localStorage.getItem(K)||'null');if(x)S=Object.assign(S,x)}catch(e){}
S.lv=Object.assign({p:1,e:1,m:1,o:1,k:1,l:1,c:1,w:1,q:1,b:1,d:1,g:1,h:1,z:1,t:1,u:1,v:1,n:1,a:1,s:1},S.lv);S.sk=Object.assign({r:[0,0],m:[0,0],a:[0,0],f:[0,0],l:[0,0],s:[0,0]},S.sk);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const G={p:{n:'Pattern detective',d:'Find the rule',c:'lilac',s:'r'},e:{n:'Echo',d:'Remember the order',c:'peach',s:'m'},m:{n:'Number chef',d:'Find the missing number',c:'mint',s:'a'},o:{n:'Sharp eye',d:'Spot the odd one',c:'sky',s:'f'},k:{n:'Memory match',d:'Find the pairs',c:'lemon',s:'m'},l:{n:'Logic clues',d:'Work out who',c:'coral',s:'r'},c:{n:'Colour clash',d:'Ink, not the word',c:'sky',s:'f'},w:{n:'Word builder',d:'Unscramble the word',c:'lilac',s:'l',lg:1},q:{n:'Shape sequence',d:'Which shape is next?',c:'lilac',s:'r'},b:{n:'Balance scale',d:'Solve the shapes',c:'coral',s:'r'},d:{n:'Odd word out',d:'Which does not belong?',c:'mint',s:'r',lg:1},g:{n:'Digit flash',d:'Remember the number',c:'peach',s:'m'},h:{n:'What is missing',d:'Spot the vanished shape',c:'sky',s:'m'},z:{n:'Backwards echo',d:'Repeat in reverse',c:'lemon',s:'m'},t:{n:'Speed sums',d:'Beat the clock',c:'coral',s:'a'},u:{n:'Make the target',d:'Pick the right pair',c:'lilac',s:'a'},v:{n:'Greater or less',d:'Compare the sums',c:'mint',s:'a'},n:{n:'Count flash',d:'Count in a blink',c:'peach',s:'f'},a:{n:'Missing letter',d:'Fill the gap',c:'sky',s:'l',lg:1},s:{n:'Mirror match',d:'Find the flip',c:'lemon',s:'s'}};
const SK={r:'Reasoning',m:'Memory',a:'Maths',f:'Focus',l:'Language',s:'Spatial'};
const B=[['First steps','Play 1 game',()=>Object.keys(S.played).length>=1],['Explorer','Try every game',()=>Object.keys(S.played).length>=Object.keys(G).length],['Star collector','Earn 50 stars',()=>S.stars>=50],['Star hoarder','Earn 200 stars',()=>S.stars>=200],['On a roll','3 days in a row',()=>S.streak>=3],['Week warrior','7 days in a row',()=>S.streak>=7],['Level 5','Reach level 5',()=>Math.max(...Object.values(S.lv))>=5],['Genius','Reach level 10',()=>Math.max(...Object.values(S.lv))>=10],['Skill master','Level 5 in every game of one skill',()=>Object.keys(SK).some(k=>Object.keys(G).filter(x=>G[x].s===k).every(x=>S.lv[x]>=5))]];
const ic={home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>',star:'<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',lock:'<svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>',back:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',flame:'<svg viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg>'};
const r=n=>Math.floor(Math.random()*n),sh=a=>a.sort(()=>Math.random()-.5);
const after=(f,ms)=>{const t=tok;setTimeout(()=>{if(t===tok)f()},ms)};
let ac;function tone(f,d=.18){if(!S.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),n=ac.createGain();o.frequency.value=f;n.gain.value=.12;o.connect(n);n.connect(ac.destination);o.start();n.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const dailyId=()=>{const k=Object.keys(G);return k[Math.floor(Date.now()/864e5)%k.length]};
const streak=()=>S.last===D||S.last===Y?S.streak:0;
function go(v){tok++;view=v;gate=false;render()}
function render(){$('#v').innerHTML=V[S.name?view:'wel']();syncAd();$('#nav').style.display=S.name?'':'none';$('#nav').innerHTML=[['home',ic.home,'Home'],['rew',ic.star,'Rewards'],['par',ic.lock,'Parents']].map(([k,i,l])=>`<button aria-label="${l}" ${view===k||(k==='home'&&view==='game')?'aria-current="page"':''} onclick="go('${k}')">${i}</button>`).join('');window.scrollTo(0,0)}
const V={
home(){const d=dailyId(),lv=Math.round(Object.values(S.lv).reduce((a,b)=>a+b)/Object.keys(S.lv).length);
return`<div class="hd"><div><p class="sm">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</p><b style="font-size:22px">Hello, ${S.name}</b></div><button class="ib" aria-label="Streak" onclick="go('str')">${ic.flame}</button></div>
<div class="card lilac" style="margin-top:20px"><span class="chip">Daily challenge</span><h2 class="disp" style="margin:14px 0 6px">${gameName(d)}</h2><p class="sm" style="color:var(--ink)">Double stars on your first game today.</p><button class="btn" style="margin-top:16px" onclick="startGame('${d}')">Play now</button></div>
<div class="stats"><div class="card mint"><small>Stars</small><b>${S.stars}</b></div><div class="card peach"><small>Day streak</small><b>${streak()}</b></div><div class="card sky"><small>Brain level</small><b>${lv}</b></div></div>
<h3 class="ttl">Pick a game</h3><div class="chips">${['all',...Object.keys(SK)].map(k=>`<button class="chip ${flt===k?'dk':''}" style="border:0;cursor:pointer;font-family:inherit;flex:none;padding:10px 16px" onclick="flt='${k}';render()">${k==='all'?'All':SK[k]}</button>`).join('')}</div><div class="bento">${Object.keys(G).filter(k=>gameEnabled(k)&&(flt==='all'||G[k].s===flt)).map(k=>`<button class="card gc ${G[k].c}" onclick="startGame('${k}')"><span class="chip">Level ${S.lv[k]}</span><div><b>${gameName(k)}</b><p class="sm" style="color:var(--ink);margin-top:4px">${gameDesc(k)}</p></div></button>`).join('')}</div>${remote.announcement?`<div class="card white" style="margin-top:16px"><b>Notice</b><p class="sm" style="margin-top:6px">${clean(remote.announcement)}</p></div>`:''}${sponsorHtml('home')}`},
wel(){return`<h1 class="disp" style="margin-top:36px">Welcome to Brain Playground</h1><p class="sm" style="margin-top:8px">What is your name?</p><input id="nm" maxlength="14" placeholder="Your name" aria-label="Your name"><button class="btn" style="width:100%" onclick="setName()">Start</button>`},
str(){const w=Array.from({length:7},(_,i)=>new Date(Date.now()-(6-i)*864e5).toLocaleDateString('en-CA'));
return`<div class="hd"><button class="ib" aria-label="Back" onclick="go('home')">${ic.back}</button></div><div class="card peach" style="margin-top:18px;text-align:center"><span class="chip">Day streak</span><div class="big">${streak()}</div><p class="sm" style="color:var(--ink)">Best: ${S.best} days</p></div><div class="seq" style="gap:6px">${w.map(d=>`<span style="min-width:0;flex:1;padding:12px 0;font-size:14px;${S.days.includes(d)?'background:var(--mint)':''}">${new Date(d).toLocaleDateString('en',{weekday:'narrow',timeZone:'UTC'})}</span>`).join('')}</div><h3 class="ttl">Milestones</h3>${[[3,5],[7,15],[14,30]].map(([n,x])=>{const c=S.claimed.includes(n),ok=streak()>=n;return`<div class="bad ${ok||c?'':'lock'}"><i></i><div style="flex:1"><b>${n} days · +${x} stars</b></div>${c?'<span class="chip">Claimed</span>':ok?`<button class="btn" style="min-height:40px;padding:8px 16px" onclick="claim(${n},${x})">Claim</button>`:''}</div>`}).join('')}${streak()?'':'<p class="sm">Play a game today to start a streak.</p>'}`},
game(){return`<div class="hd"><button class="ib" aria-label="Back" onclick="go('home')">${ic.back}</button><div class="dots">${[0,1,2,3,4].map(i=>`<i class="${i<g.r?'d':''}"></i>`).join('')}</div><span class="chip dk">Lv ${g.L}</span></div><h2 class="ttl" style="margin-bottom:0">${gameName(g.id)}</h2><p class="sm" style="margin-top:6px">${clean(gameInstructions(g.id))}</p>${G[g.id].lg?`<button class="chip dk" style="border:0;cursor:pointer;margin-top:10px;padding:10px 16px" onclick="cyc()">${LN[S.lang]}</button>`:''}<div id="body"></div><p id="msg"></p>`},
res(){return`<div class="card ${G[g.id].c}" style="margin-top:20px;text-align:center"><span class="chip">${G[g.id].n}</span><div class="big">${g.ok}/5</div><p class="disp" style="font-size:26px">+${g.stars} stars</p><p class="sm" style="color:var(--ink);margin-top:8px">${g.note}</p>${g.nb.map(b=>`<p style="margin-top:10px"><span class="chip dk">New badge: ${b}</span></p>`).join('')}</div>${sponsorHtml('result')}<div style="display:grid;gap:12px;margin-top:18px"><button class="btn" onclick="startGame('${g.id}')">Play again</button><button class="btn lt" onclick="go('home')">Home</button></div>`},
rew(){return`<h1 class="disp">Rewards</h1><div class="stats"><div class="card lemon"><small>Stars</small><b>${S.stars}</b></div><div class="card peach"><small>Streak</small><b>${streak()}</b></div><div class="card mint"><small>Badges</small><b>${S.badges.length}</b></div></div><h3 class="ttl">Badges</h3>${B.map(b=>`<div class="bad ${S.badges.includes(b[0])?'':'lock'}"><i></i><div><b>${b[0]}</b><p class="sm">${b[1]}</p></div></div>`).join('')}`},

admin(){return adminView()},
par(){if(!S.pin||pg.ch)return`<h1 class="disp">Set parent PIN</h1><p class="sm" style="margin-top:8px">Choose a 4-digit PIN. Recovery question: what is your favourite food?</p><div class="card white" style="margin-top:18px"><input id="p1" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" aria-label="PIN"><input id="ra" placeholder="Recovery answer" aria-label="Recovery answer"><button class="btn" onclick="setPin()">Save PIN</button><p id="pe" class="sm" style="margin-top:10px;text-align:center"></p></div>`;
if(!gate)return`<h1 class="disp">Parent corner</h1><p class="sm" style="margin-top:8px">${pg.fg?'Recovery question: what is your favourite food?':'Grown-ups only. Enter your PIN.'}</p><div class="card white" style="margin-top:18px"><input id="gi" ${pg.fg?'':'type="password" inputmode="numeric" maxlength="4"'} aria-label="Answer"><button class="btn" onclick="${pg.fg?'recover()':'tryPin()'}">Enter</button><p id="pe" class="sm" style="margin-top:10px;text-align:center"></p><button class="btn lt" style="width:100%;margin-top:12px" onclick="go('admin')">Cloud Admin Login</button><p class="sm" style="text-align:center;margin-top:10px"><a href="#" onclick="pg.fg=!pg.fg;render();return false">${pg.fg?'Use PIN':'Forgot PIN?'}</a></p></div>`;
const tips={r:'Spotting rules in number patterns builds logical thinking.',m:'Recalling sequences strengthens working memory.',a:'Missing-number puzzles build number sense and mental maths.',f:'Finding tiny differences trains attention and visual focus.',l:'Unscrambling words builds vocabulary and spelling.',s:'Flipping shapes in the mind builds spatial thinking.'};

function cnt(){const L=g.L,c=3+Math.floor(L/2)+r(3),dc=L>2?2+r(L):0,cells=Array(24).fill('');
sh([...cells.keys()]).slice(0,c+dc).forEach((p,i)=>cells[p]=i<c?'★':'■');
setBody(hint('Count the stars ★')+`<div class="grid" style="grid-template-columns:repeat(6,1fr);font-size:26px;text-align:center">${cells.map(x=>`<span>${x||'&nbsp;'}</span>`).join('')}</div>`);
after(()=>setBody(hint('How many stars did you see?')+`<div style="height:14px"></div>`+choices(c,opts(c))),1200+c*150)}
function mls(){const T=W[S.lang],t=Math.min(Math.floor((g.L-1)/3),2),w=T[t][r(T[t].length)],p=seg(w),i=r(p.length),m=p[i],pool=[...new Set(T.flat().flatMap(seg))];
setBody(`<div dir="${S.lang==='ar'?'rtl':'ltr'}" class="q" style="font-size:44px">${p.map((x,j)=>j===i?'_':x).join('')}</div>${hint('Which part is missing?')}<div style="height:14px"></div>`+choices(m,sh([m,...sh(pool.filter(x=>x!==m)).slice(0,3)])))}
function mir(){const n=g.L<4?3:g.L<8?4:5,k=Math.floor(n*n*.4),J=a=>a.join(''),fl=a=>a.map((v,i)=>a[Math.floor(i/n)*n+n-1-i%n]),vf=a=>a.map((v,i)=>a[(n-1-Math.floor(i/n))*n+i%n]);
const mut=a=>{const b=a.slice(),o=[],z=[];b.forEach((v,i)=>(v?o:z).push(i));b[o[r(o.length)]]=0;b[z[r(z.length)]]=1;return b};
let p,m,t=0;do{p=sh(Array.from({length:n*n},(_,i)=>i<k?1:0));m=fl(p)}while(J(p)===J(m)&&t++<50);
const U=[];[m,p,vf(p),mut(m)].forEach(x=>{if(!U.some(y=>J(y)===J(x)))U.push(x)});t=0;while(U.length<4&&t++<99){const x=mut(r(2)?m:p);if(!U.some(y=>J(y)===J(x)))U.push(x)}
const O=sh(U.map((x,i)=>[x,i===0])),dr=(a,z)=>`<div style="display:grid;grid-template-columns:repeat(${n},${z}px);gap:3px;justify-content:center">${a.map(v=>`<i style="width:${z}px;height:${z}px;border-radius:5px;background:${v?'var(--ink)':'rgba(20,21,31,.12)'}"></i>`).join('')}</div>`;
g.ans=O.findIndex(x=>x[1]);
setBody(`<div class="card white" style="margin-top:14px;padding:16px">${dr(p,28)}</div>${hint('Which one is the mirror image, flipped left to right?')}<div class="opts" style="margin-top:12px">${O.map((x,i)=>`<button class="o" style="min-height:120px" onclick="pick(this,${i})">${dr(x[0],18)}</button>`).join('')}</div>`)}
let adminTab='dashboard',adminGame='p',adminSponsor=-1,adminEditingQuestion=-1,adminDraft=null,adminQDraft={};

if(adminEditingQuestion>=0||adminEditingQuestion===-1&&adminQDraft.active)h+=adminQuestionForm();
return h;}

function adminSponsors(){const list=adminDraft.ads.list||[];let h='<div class="hd"><div><h2 class="ttl" style="margin:0">Sponsors</h2><p class="sm" style="margin-top:5px">Create and control the sponsor card shown to users.</p></div><button class="btn" style="min-height:46px;padding:10px 16px" onclick="adminNewSponsor()">+ Add sponsor</button></div><div class="adm-list">'+(list.length?list.map((x,i)=>'<div class="adm-row"><div><b>'+adminEscape(x.name||'Unnamed sponsor')+'</b><p class="adm-muted">'+(x.enabled===false?'Paused':'Active')+' · '+adminEscape((x.slots||['home']).join(' · '))+'</p></div><button class="btn lt" style="min-height:42px;padding:9px 14px;font-size:13px" onclick="adminSponsor='+i+';render()">Edit</button></div>').join(''):'<div class="card white"><p class="sm">No sponsors yet. Add your first sponsor.</p></div>')+'</div>';

async function adminLogin(){const e=$('#ae')?.value.trim(),p=$('#ap')?.value;if(!cloudReady()||!e||!p)return;try{let user=null;if(cloud){const {data,error}=await cloud.auth.signInWithPassword({email:e,password:p});if(error)throw error;user=data.user;localStorage.setItem('bp_admin_session',data.access_token||'')}else{const r=await fetch(BP_SUPABASE.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':BP_SUPABASE.anon,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});const data=await r.json();if(!r.ok)throw new Error(data.error_description||data.msg||'Admin sign-in failed');user=data.user;localStorage.setItem('bp_admin_session',data.access_token||'')}adminUser=user;go('admin')}catch(err){$('#aeMsg').textContent=err.message||'Admin sign-in failed'}}
async function adminLogout(){try{if(cloud)await cloud.auth.signOut()}catch(e){}localStorage.removeItem('bp_admin_session');adminUser=null;go('par')}
async function publishRemote(){
if(!cloudReady()||!adminUser)return;
try{
adminEnsureDraft();
const data=adminClone(adminDraft);
if(!data.games||typeof data.games!=='object')throw new Error('Game data is invalid.');
if(!data.ads||typeof data.ads!=='object')throw new Error('Sponsor data is invalid.');
let error=null;
if(cloud){const q=await cloud.from('app_config').upsert({id:'main',data,updated_at:new Date().toISOString()});error=q.error}else{
const token=localStorage.getItem('bp_admin_session');const r=await fetch(BP_SUPABASE.url+'/rest/v1/app_config?on_conflict=id',{method:'POST',headers:Object.assign(restHeaders(token),{'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({id:'main',data,updated_at:new Date().toISOString()})});if(!r.ok)error=new Error(await r.text()||('Publish failed ('+r.status+')'))
}
if(error)throw error;
remote=data;adminDraft=adminClone(data);try{localStorage.setItem('brainplay_cloud',JSON.stringify(remote))}catch(e){}
adminTab='dashboard';render();
setTimeout(()=>{const m=$('#adminMsg');if(m)m.textContent='Published successfully. Connected apps will sync automatically.'},0);
}catch(e){const m=$('#adminMsg');if(m)m.textContent=e.message||'Publish failed'}
}

try{const c=JSON.parse(localStorage.getItem('brainplay_cloud')||'null');if(c){remote=Object.assign(remote,c);adConfig=Object.assign(adConfig,remote.ads?.admob||{})}}catch(e){};try{const t=localStorage.getItem('bp_admin_session');if(t&&!adminUser)adminUser={id:'rest-session'}}catch(e){} render();cloudInit();
</script></body></html>
