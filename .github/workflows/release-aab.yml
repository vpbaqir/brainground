name: Build Brain Playground Play Store AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path("app/src/main/assets/index.html")
          s=p.read_text()
          s=s.replace("YOUR_SUPABASE_URL", os.environ.get("SUPABASE_URL",""))
          s=s.replace("YOUR_SUPABASE_ANON_KEY", os.environ.get("SUPABASE_ANON_KEY",""))
          p.write_text(s)
          PY

      - name: Configure AdMob
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path("app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if os.environ.get("ADMOB_APP_ID"):
              s=s.replace("ca-app-pub-3940256099942544~3347511713", os.environ["ADMOB_APP_ID"])
          p.write_text(s)
          p=Path("app/src/main/java/com/vpbaqir/brainplayground/MainActivity.java")
          s=p.read_text()
          if os.environ.get("ADMOB_BANNER_ID"):
              s=s.replace("ca-app-pub-3940256099942544/9214589741", os.environ["ADMOB_BANNER_ID"])
          p.write_text(s)
          PY

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing SIGNING_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing SIGNING_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing SIGNING_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing SIGNING_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > release.keystore
          cat > signing.properties <<EOF
          storeFile=../release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release AAB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          s += '''
          
          def signingProps = new Properties()
          file("signing.properties").withInputStream { signingProps.load(it) }
          
          android {
              signingConfigs {
                  release {
                      storeFile file(signingProps["storeFile"])
                      storePassword signingProps["storePassword"]
                      keyAlias signingProps["keyAlias"]
                      keyPassword signingProps["keyPassword"]
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          '''
          p.write_text(s)
          PY
          gradle --no-daemon bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: brain-playground-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        run: rm -f release.keystore signing.properties
