name: Build Brain Playground APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/assets/index.html")
          s=p.read_text()
          import os
          s=s.replace("YOUR_SUPABASE_URL", os.environ.get("SUPABASE_URL",""))
          s=s.replace("YOUR_SUPABASE_ANON_KEY", os.environ.get("SUPABASE_ANON_KEY",""))
          p.write_text(s)
          PY

      - name: Configure AdMob
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path("app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if os.environ.get("ADMOB_APP_ID"):
              s=s.replace("ca-app-pub-3940256099942544~3347511713", os.environ["ADMOB_APP_ID"])
          p.write_text(s)
          p=Path("app/src/main/java/com/vpbaqir/brainplayground/MainActivity.java")
          s=p.read_text()
          if os.environ.get("ADMOB_BANNER_ID"):
              s=s.replace("ca-app-pub-3940256099942544/9214589741", os.environ["ADMOB_BANNER_ID"])
          p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brain-playground-apk
          path: app/build/outputs/apk/debug/app-debug.apk
