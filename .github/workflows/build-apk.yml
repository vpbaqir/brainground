name: Build Brain Playground APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path("app/src/main/assets/index.html")
          s=p.read_text()
          s=s.replace("YOUR_SUPABASE_URL", os.environ.get("SUPABASE_URL",""))
          s=s.replace("YOUR_SUPABASE_ANON_KEY", os.environ.get("SUPABASE_ANON_KEY",""))
          p.write_text(s)
          PY

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("app/src/main/assets/index.html").read_text()
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/brain-playground.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/brain-playground.js

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brain-playground-apk
          path: app/build/outputs/apk/debug/app-debug.apk
