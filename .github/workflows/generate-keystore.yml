name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Store & Key Password (leave empty for auto-generated)'
        required: false
        default: 'BrainPlayground2026!'
      alias:
        description: 'Key Alias'
        required: true
        default: 'brainplayground'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Keystore
        id: gen
        run: |
          ALIAS="${{ github.event.inputs.alias }}"
          PASS="${{ github.event.inputs.store_password }}"
          
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Brain Playground, OU=Mobile, O=VPBaqir, L=Kochi, ST=Kerala, C=IN"
          
          B64=$(base64 -w 0 release.keystore)
          
          echo "### 🔐 Production Release Keystore Generated Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Add these 4 secrets to your GitHub repository under **Settings > Secrets and variables > Actions**:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Name | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`SIGNING_KEY_ALIAS\` | \`$ALIAS\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`SIGNING_STORE_PASSWORD\` | \`$PASS\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`SIGNING_KEY_PASSWORD\` | \`$PASS\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary><b>Click to show SIGNING_KEYSTORE_BASE64</b></summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$B64" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Upload Keystore as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
